# ============================================================
# Decap CMS configuration for Maui's Deli & Shop
# Backend: Netlify Identity + Git Gateway
# ============================================================

backend:
  name: git-gateway
  branch: main

# Where uploaded images go
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

# Show a friendly site URL after saving
site_url: https://lighthearted-babka-70d564.netlify.app
display_url: https://lighthearted-babka-70d564.netlify.app
logo_url: /assets/images/flame.svg

# ============================================================
# COLLECTIONS — what the owner can edit
# ============================================================
collections:

  # ----------------------------------------------------------
  # 1. MENU ITEMS — main source of truth
  # ----------------------------------------------------------
  - name: "menu"
    label: "🍽️ Menu Items"
    description: "The main place to manage every item. Status, Neighborhood Favorites, and Weekly Specials are all controlled here."
    files:
      - name: "menu"
        label: "Full Menu"
        file: "data/menu.json"
        format: "json"
        fields:
          - label: "Menu Items"
            name: "items"
            widget: "list"
            summary: "{{fields.name}} — ${{fields.price}} ({{fields.status}})"
            fields:
              - { label: "Item Name", name: "name", widget: "string" }
              - { label: "Slug (auto-generated identifier)", name: "slug", widget: "string", required: true, hint: "Letters/numbers/dashes only. Used by Sub of the Week to point at this item. If you change the name, edit this too (e.g. 'turkey-club')." }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Price ($)", name: "price", widget: "number", value_type: "float", step: 0.01, required: false }
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - "Tacos"
                  - "Burritos"
                  - "Quesadillas"
                  - "Taco Bowls"
                  - "Empanadas"
                  - "Loaded Fries"
                  - "Sandwiches"
                  - "Breakfast"
                  - "Salads"
                  - "Wraps"
                  - "Coffee"
                  - "Sides"
                  - "Ice Cream"
                  - "Desserts"
                  - "Drinks"
                  - "Specialties"
                  - "Other"
              - label: "Status"
                name: "status"
                widget: "select"
                default: "Active"
                options:
                  - "Active"
                  - "Hidden"
                  - "Coming Soon"
                hint: "Active = visible everywhere. Hidden = not shown anywhere on the public site. Coming Soon = shown with a Coming Soon label and no price."
              - { label: "Show in Neighborhood Favorites", name: "showInNeighborhoodFavorites", widget: "boolean", default: false, hint: "Toggle ON to feature this item on the homepage." }
              - label: "Weekly Special days"
                name: "weeklySpecialDays"
                widget: "select"
                multiple: true
                required: false
                default: []
                options:
                  - "Monday"
                  - "Tuesday"
                  - "Wednesday"
                  - "Thursday"
                  - "Friday"
                  - "Saturday"
                  - "Sunday"
                hint: "Pick the days this item is the $9.99 special. Leave empty if it's not a special."
              - { label: "Photo (optional)", name: "image", widget: "image", required: false }
              - { label: "Sort order", name: "sortOrder", widget: "number", value_type: "int", default: 0, required: false, hint: "Lower numbers show first within a category. 0 is fine for most items." }

  # ----------------------------------------------------------
  # NEIGHBORHOOD FAVORITES collection has been REMOVED from the admin sidebar.
  # Neighborhood Favorites are now controlled exclusively from 🍽️ Menu Items
  # using the "Show in Neighborhood Favorites" toggle on each item.
  # data/featured.json is kept as a backup file in the repo but is no longer
  # an editable collection in the admin and is not read by the public site.
  # ----------------------------------------------------------

  # ----------------------------------------------------------
  # 3. SUB OF THE WEEK — picks one menu item by slug
  # ----------------------------------------------------------
  - name: "sub_of_week"
    label: "🥪 Sub of the Week"
    description: "Pick one item from the Menu to spotlight this week. The site pulls its name, description, price, and photo from the menu item."
    files:
      - name: "sub"
        label: "Sub of the Week"
        file: "data/sub-of-week.json"
        format: "json"
        fields:
          - label: "Pick a Menu Item"
            name: "selectedSlug"
            widget: "relation"
            collection: "menu"
            file: "menu"
            value_field: "items.*.slug"
            search_fields: ["items.*.name", "items.*.slug"]
            display_fields: ["items.*.name"]
            required: false
            hint: "Type the dish name to find it. Leaving this empty falls back to the manual fields below."
          - { label: "Short promo line", name: "promo", widget: "string", required: false, default: "Sub of the Week", hint: "e.g. 'Sub of the Week' or 'This week only'." }
          - { label: "— Manual fallback (used only if no menu item picked above) —", name: "name", widget: "string", required: false, hint: "Only fill this in to spotlight something not on the regular menu." }
          - { label: "Manual description", name: "description", widget: "text", required: false }
          - { label: "Manual price ($)", name: "price", widget: "number", value_type: "float", step: 0.01, required: false }
          - { label: "Manual photo", name: "image", widget: "image", required: false }

  # ----------------------------------------------------------
  # 4. WEEKLY SPECIALS — legacy fallback (off-menu daily specials)
  # ----------------------------------------------------------
  - name: "specials"
    label: "💸 Weekly Specials (legacy)"
    description: "Most weekday specials are now controlled in 🍽️ Menu Items → 'Weekly Special days' field. This list is a fallback for days when the special is something not on the regular menu (e.g. 'Cheese Burger'). Days here only show if no menu item is assigned to that day."
    files:
      - name: "specials"
        label: "Specials List (legacy)"
        file: "data/specials.json"
        format: "json"
        fields:
          - { label: "Banner headline (optional)", name: "headline", widget: "string", required: false }
          - { label: "Note (optional)", name: "note", widget: "text", required: false }
          - label: "Specials"
            name: "items"
            widget: "list"
            summary: "{{fields.label}}: {{fields.title}}"
            fields:
              - { label: "Day or label", name: "label", widget: "string", required: false, hint: "e.g. 'Monday' or 'Weekend Special'" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Price ($)", name: "price", widget: "number", value_type: "float", step: 0.01, required: false }

  # ----------------------------------------------------------
  # 5. COMMUNITY BOARD (new section)
  # ----------------------------------------------------------
  - name: "community"
    label: "📋 Community Board"
    description: "Neighborhood posts, shop updates, and local events. Up to 3 show on the homepage; more on What's New."
    files:
      - name: "community"
        label: "Community Posts"
        file: "data/community.json"
        format: "json"
        fields:
          - label: "Posts"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} ({{fields.category}})"
            fields:
              - { label: "Post Title", name: "title", widget: "string" }
              - { label: "Short Description", name: "description", widget: "text" }
              - label: "Category"
                name: "category"
                widget: "select"
                default: "Community"
                options:
                  - "Community"
                  - "Shop Update"
                  - "Local Event"
                  - "Fundraiser"
                  - "School"
                  - "Sports"
                  - "Announcement"
                  - "Coming Soon"
              - { label: "Date (YYYY-MM-DD)", name: "date", widget: "string", required: false, hint: "e.g. 2026-05-12" }
              - { label: "Optional photo", name: "image", widget: "image", required: false }
              - { label: "Pinned? (shows first)", name: "pinned", widget: "boolean", default: false }
              - { label: "Active? (visible on site)", name: "active", widget: "boolean", default: true }
              - { label: "Archived? (hide permanently)", name: "archived", widget: "boolean", default: false }
              - { label: "Button text (optional)", name: "buttonText", widget: "string", required: false, hint: "e.g. 'Learn more'" }
              - { label: "Button link (optional)", name: "buttonLink", widget: "string", required: false, hint: "e.g. https://example.com" }
              - { label: "Sort order", name: "sortOrder", widget: "number", value_type: "int", default: 1 }

  # ----------------------------------------------------------
  # 6. STORE NEWS / ANNOUNCEMENT BAR
  # ----------------------------------------------------------
  - name: "announcement"
    label: "📣 Store News / Announcement"
    description: "The short banner that appears at the top of every page."
    files:
      - name: "announcement"
        label: "Announcement"
        file: "data/announcement.json"
        format: "json"
        fields:
          - { label: "Show this announcement?", name: "active", widget: "boolean", default: true }
          - { label: "Headline", name: "headline", widget: "string", hint: "Keep it short: 'Closing early Friday', 'Thanks for the support!'" }
          - { label: "Message", name: "message", widget: "string", required: false }

  # ----------------------------------------------------------
  # 7. GALLERY
  # ----------------------------------------------------------
  - name: "gallery"
    label: "📷 Gallery Photos"
    description: "Real food photos from the kitchen. Add, remove, or reorder."
    files:
      - name: "gallery"
        label: "Gallery"
        file: "data/gallery.json"
        format: "json"
        fields:
          - label: "Photos"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Title", name: "title", widget: "string", required: false }
              - { label: "Short caption", name: "caption", widget: "string", required: false }
              - { label: "Category (optional)", name: "category", widget: "string", required: false }
              - { label: "Featured", name: "featured", widget: "boolean", default: false }
              - { label: "Sort order", name: "sort", widget: "number", value_type: "int", default: 1 }

  # ----------------------------------------------------------
  # 8. HOURS
  # ----------------------------------------------------------
  - name: "hours"
    label: "🕐 Hours"
    description: "Update your open hours for each day."
    files:
      - name: "hours"
        label: "Hours of Operation"
        file: "data/hours.json"
        format: "json"
        fields:
          - label: "Days"
            name: "days"
            widget: "list"
            summary: "{{fields.day}} — {{fields.hours}}"
            fields:
              - { label: "Day", name: "day", widget: "string", hint: "e.g. Monday" }
              - { label: "Hours", name: "hours", widget: "string", hint: "e.g. 7:00 AM – 7:00 PM, or 'Closed'" }
          - { label: "Note (optional)", name: "note", widget: "string", required: false, hint: "e.g. 'Hours may vary on holidays.'" }

  # ----------------------------------------------------------
  # 9. SETTINGS — homepage section toggles & coming-soon flags
  # ----------------------------------------------------------
  - name: "settings"
    label: "⚙️ Settings"
    description: "Turn homepage sections on/off and flip 'coming soon' labels."
    files:
      - name: "settings"
        label: "Site Settings"
        file: "data/settings.json"
        format: "json"
        fields:
          - label: "Homepage sections (show or hide)"
            name: "sections"
            widget: "object"
            fields:
              - { label: "Neighborhood Favorites", name: "featured", widget: "boolean", default: true }
              - { label: "Sub of the Week", name: "subOfWeek", widget: "boolean", default: true }
              - { label: "Weekly Specials", name: "specials", widget: "boolean", default: true }
              - { label: "In the Shop", name: "shop", widget: "boolean", default: true }
              - { label: "Community Board", name: "community", widget: "boolean", default: true }
              - { label: "Breakfast Coming Soon", name: "breakfastComingSoon", widget: "boolean", default: true }
          - label: "Coming Soon labels"
            name: "comingSoon"
            widget: "object"
            fields:
              - { label: "Breakfast coming soon", name: "breakfast", widget: "boolean", default: true }
              - { label: "Ice cream coming soon", name: "iceCream", widget: "boolean", default: false }
              - { label: "Beer & wine coming soon", name: "beerWine", widget: "boolean", default: true }
